site:
    name: FunkeLab
    site: 'https://www.lab.diefunke.de'
    base: '/'
    trailingSlash: false

    googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
    title:
        default: FunkeLab
        template: '%s — FunkeLab'
    description: 'Offener Makerspace in der Karlsruher Nordweststadt: Geräte, Werkzeuge und Platz für eigene Projekte. Betrieben von der Funke e.V.'
    robots:
        index: true
        follow: true
    openGraph:
        site_name: FunkeLab
        images:
            - url: '~/assets/images/werkstatt_eingang.jpg'
              width: 1200
              height: 628
        type: website
    twitter:
        handle: '@onwidget'
        site: '@onwidget'
        cardType: summary_large_image

i18n:
    language: de
    textDirection: ltr

analytics:
    vendors:
        googleAnalytics:
            id: null # or "G-XXXXXXXXXX"

ui:
    theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
